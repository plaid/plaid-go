version: 2.1

jobs:
  build:
    docker:
      # cimg/go:1.21.13; exercise the SDK's minimum supported Go version.
      - image: cimg/go@sha256:312861424d0144f66feb4a454932107a8cec01bf246127deb3371ed3b43d135d
    environment:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
    steps:
      - run:
          name: Check out the public SDK at the exact commit
          command: |
            [[ "$CIRCLE_SHA1" =~ ^[0-9a-f]{40}$ ]]
            git init .
            git remote add origin https://github.com/plaid/plaid-go.git
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= fetch --no-tags --depth=1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - run:
          name: Build both SDK packages
          command: go build ./...

workflows:
  build:
    jobs:
      - build
